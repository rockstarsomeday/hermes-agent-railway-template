# Auto-merges Dependabot's minor/patch bumps of the browser image (browser/).
# Major bumps and every other Dependabot PR (Hermes, sandbox, actions) stay
# manual. Merging to main redeploys hermes-browser on Railway.
name: Browser auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
      - name: Merge if it only bumps browser/Dockerfile
        if: >-
          steps.meta.outputs.package-ecosystem == 'docker' &&
          steps.meta.outputs.directory == '/browser' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          if [ "$files" != "browser/Dockerfile" ]; then
            echo "PR touches more than browser/Dockerfile; leaving it for review:"
            echo "$files"
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
